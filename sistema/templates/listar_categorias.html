{% extends 'base.html' %}
{% block content %}
<section class="banner-topo">
  <span class="banner-label">Administração</span>
  <h1 class="banner-titulo">Categorias de <em>Produtos</em></h1>
  <div class="banner-divisor">
    <span></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/>
    </svg>
    <span></span>
  </div>
</section>

<section class="admin-secao">
  <div class="admin-header">
    <h2 class="admin-header-titulo">Categorias</h2>
    <a href="{% url 'add_categoria' %}" class="btn-admin-novo">+ Nova Categoria</a>
  </div>
  <div class="admin-table-wrap">
    <table class="admin-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for categoria in categorias %}
        <tr>
          <td class="td-id">{{ categoria.id }}</td>
          <td>{{ categoria.nome }}</td>
          <td>
            <a href="{% url 'editar_categoria' categoria.id %}" class="btn-acao btn-acao-editar">Editar</a>
            <a href="{% url 'excluir_categoria' categoria.id %}" class="btn-acao btn-acao-excluir">Excluir</a>
          </td>
        </tr>
        {% empty %}
        <tr class="admin-table-vazia"><td colspan="3">Nenhuma categoria cadastrada.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</section>
{% endblock %}
