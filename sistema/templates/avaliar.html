{% extends 'base.html' %}
{% block content %}
<div class="admin-form-wrapper">
  <div class="admin-form-card">
    <div class="admin-form-card-top"></div>
    <div class="admin-form-card-body">
      <div class="admin-form-badge">
        <span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2l2.4 7.4H22l-6.2 4.5 2.4 7.4L12 17l-6.2 4.3 2.4-7.4L2 9.4h7.6z"/></svg>
        <span></span>
      </div>
      <h2 class="admin-form-titulo">Nova Avaliação</h2>
      <p class="admin-form-sub">{{ compra.produto.nome }}</p>
      <form method="POST">
        {% csrf_token %}
        <div class="admin-form-row">
          <div>
            <label>Seu nome</label>
            <input type="text" value="{{ user.username }}" disabled>
          </div>
          <div style="max-width: 130px;">
            <label>Nota (1 a 5)</label>
            <input type="number" name="nota" min="1" max="5" required>
          </div>
        </div>
        <div>
          <label>Comentário</label>
          <textarea name="comentario" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn-admin-submit">Salvar Avaliação</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
