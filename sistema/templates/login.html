{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-card-top"></div>
    <div class="auth-card-body">
      <div class="auth-badge">
        <span></span>
        <svg width="10" height="10" viewBox="0 0 14 14" fill="currentColor">
          <path d="M7 0l1.5 5.5L14 7l-5.5 1.5L7 14l-1.5-5.5L0 7l5.5-1.5z"/>
        </svg>
        <span></span>
      </div>
      <h2 class="auth-titulo">Bem-vinda de volta</h2>
      <p class="auth-sub">Entre na sua conta Aurora Boutique</p>
      <form method="POST">
        {% csrf_token %}
        {% for field in form %}
          <div>
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
              <p class="campo-erro">{{ field.errors|striptags }}</p>
            {% endif %}
          </div>
        {% endfor %}
        <button type="submit" class="btn-auth">Entrar</button>
      </form>
      <div class="auth-link">
        Ainda não tem conta? <a href="{% url 'criar_conta' %}">Crie a sua agora</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
